<circle cx="398" cy="155" r="3.5" fill="#3fb950" opacity="0.8"/>
<text x="414" y="159" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="10" fill="#8b949e">ebpf-detect · session</text>
<line x1="358" y1="170" x2="842" y2="170" stroke="#30363d" stroke-width="1"/>
<g font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="11.5">
  <text x="376" y="196"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">id</tspan></text>
  <text x="376" y="213" fill="#8b949e">uid=10001(user) gid=10001(user)</text>
  <text x="376" y="238"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">backup-tool &quot;x; id #&quot;</tspan><tspan fill="#6e7681">   # SUID injection</tspan></text>
  <text x="376" y="255"><tspan fill="#f85149" font-weight="600">uid=0(root) gid=0(root)</tspan><tspan fill="#8b949e"> groups=10001(user)</tspan></text>

  .numt{fill:#1a1d21;font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:middle;}
  .legt{fill:#c3cad3;font-size:13.5px;dominant-baseline:middle;}
  .bg-blue rect{fill:#1f3350;stroke:#3f78bf;stroke-width:1.4;}

<svg width="1120" viewBox="0 0 1120 1120" xmlns="http://www.w3.org/2000/svg" role="img">
<title>K8 Labs - production architecture (pull-model GitOps)</title>
<desc>Publish side: GitHub source repo, CI GitHub Actions, GHCR OCI registry. A Hetzner cluster pulls images and manifests via ArgoCD (never pushed in). Nuremberg CX33 control-plane node runs the k8s platform, ArgoCD, Go backend, React frontend, Postgres, Vault, Traefik ingress and cert-manager, plus a deployed observability+EDR stack (Loki, Grafana, Alloy, Tetragon) and an optional deferred Prometheus. A Falkenstein AX41 bare-metal labs worker runs each session as a session-runner pod wrapped in a Kata/Firecracker microVM around a disposable nested k3s cluster holding the lab. Cloudflare fronts the site; firewalls gate the origin; admin SSH is the break-glass path.</desc>

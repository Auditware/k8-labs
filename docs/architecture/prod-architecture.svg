  .grp-amber{fill:none;stroke:#a8712a;stroke-width:1.3;stroke-dasharray:5 5;}
  .grp-solid{fill:none;stroke:#3c424a;stroke-width:1.3;}
  .arr{stroke:#7e8792;stroke-width:1.6;fill:none;}
  .pull{stroke:#df8a2e;stroke-width:2.2;fill:none;stroke-dasharray:8 6;stroke-linecap:round;}
  .brk{stroke:#d9534f;stroke-width:2.2;fill:none;stroke-dasharray:8 6;stroke-linecap:round;}
</style>

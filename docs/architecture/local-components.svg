<svg width="680" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Local full component diagram</title>
<desc>Every component of the local k3d environment. On the host: browser and the Vite frontend dev server. GitHub holds the repo. The control-plane node runs edge and app containers (Traefik, backend, postgres), GitOps and secrets (cert-manager, Vault, ArgoCD), observability (Loki, Grafana, Alloy), and runtime plus EDR (Cilium, Tetragon, local registry). The labs node runs the per-session primary and target pods with two NetworkPolicies.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #1a1d22; }
  .ts { font-size: 12px; fill: #4b525c; }
  .box { fill: #f5f5f6; stroke: #c7cbd1; stroke-width: 0.5; }
  .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
  .arr { stroke: #4b525c; stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#4b525c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="680" height="600" fill="#ffffff"/>

<text class="th" x="30" y="26">Local - full components (k3d · k8labs-local)</text>

<g class="c-gray"><rect x="30" y="38" width="386" height="82" rx="10" stroke-width="0.5"/></g>
<text class="ts" x="42" y="56">Host - macOS (outside cluster)</text>
<rect class="box" x="44" y="66" width="170" height="44" rx="6"/>
<text class="th" x="129" y="84" text-anchor="middle" dominant-baseline="central">Browser</text>
<text class="ts" x="129" y="100" text-anchor="middle" dominant-baseline="central">user session</text>
<rect class="box" x="228" y="66" width="176" height="44" rx="6"/>
<text class="th" x="316" y="84" text-anchor="middle" dominant-baseline="central">Frontend</text>
<text class="ts" x="316" y="100" text-anchor="middle" dominant-baseline="central">bun dev :7373</text>

<g class="c-gray"><rect x="430" y="38" width="220" height="82" rx="10" stroke-width="0.5"/></g>
<text class="ts" x="442" y="56">GitHub</text>
<rect class="box" x="444" y="66" width="192" height="44" rx="6"/>
<text class="th" x="540" y="84" text-anchor="middle" dominant-baseline="central">repo</text>
<text class="ts" x="540" y="100" text-anchor="middle" dominant-baseline="central">ArgoCD source</text>

<line x1="150" y1="120" x2="176" y2="187" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="118" y="150">:8443</text>
<line x1="330" y1="120" x2="372" y2="187" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="336" y="150">/api</text>
<line x1="560" y1="120" x2="600" y2="187" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="562" y="150">gitops</text>

<g class="c-blue"><rect x="30" y="150" width="620" height="252" rx="12" stroke-width="0.5"/></g>
<text class="th" x="44" y="172">Control-plane node - k3d server · runc</text>

<text class="ts" x="40" y="214">edge/app</text>
<g class="c-blue"><rect x="140" y="190" width="154" height="44" rx="6" stroke-width="0.5"/><text class="th" x="217" y="207" text-anchor="middle">Traefik</text><text class="ts" x="217" y="223" text-anchor="middle">ingress :8080/8443</text></g>
<g class="c-blue"><rect x="311" y="190" width="154" height="44" rx="6" stroke-width="0.5"/><text class="th" x="388" y="207" text-anchor="middle">Backend</text><text class="ts" x="388" y="223" text-anchor="middle">Go API :8080</text></g>
<g class="c-blue"><rect x="482" y="190" width="154" height="44" rx="6" stroke-width="0.5"/><text class="th" x="559" y="207" text-anchor="middle">Postgres</text><text class="ts" x="559" y="223" text-anchor="middle">:5432</text></g>

<text class="ts" x="40" y="269">gitops</text>
<g class="c-purple"><rect x="140" y="245" width="154" height="44" rx="6" stroke-width="0.5"/><text class="th" x="217" y="262" text-anchor="middle">cert-manager</text><text class="ts" x="217" y="278" text-anchor="middle">self-signed CA</text></g>
<g class="c-purple"><rect x="311" y="245" width="154" height="44" rx="6" stroke-width="0.5"/><text class="th" x="388" y="262" text-anchor="middle">Vault</text><text class="ts" x="388" y="278" text-anchor="middle">+injector :8200</text></g>
<g class="c-purple"><rect x="482" y="245" width="154" height="44" rx="6" stroke-width="0.5"/><text class="th" x="559" y="262" text-anchor="middle">ArgoCD</text><text class="ts" x="559" y="278" text-anchor="middle">sync (manual)</text></g>

<text class="ts" x="40" y="324">obs</text>
<g class="c-teal"><rect x="140" y="300" width="154" height="44" rx="6" stroke-width="0.5"/><text class="th" x="217" y="317" text-anchor="middle">Loki</text><text class="ts" x="217" y="333" text-anchor="middle">logs</text></g>
<g class="c-teal"><rect x="311" y="300" width="154" height="44" rx="6" stroke-width="0.5"/><text class="th" x="388" y="317" text-anchor="middle">Grafana</text><text class="ts" x="388" y="333" text-anchor="middle">dashboards</text></g>
<g class="c-teal"><rect x="482" y="300" width="154" height="44" rx="6" stroke-width="0.5"/><text class="th" x="559" y="317" text-anchor="middle">Alloy</text><text class="ts" x="559" y="333" text-anchor="middle">collector</text></g>

<text class="ts" x="40" y="379">platform</text>
<g class="c-gray"><rect x="140" y="355" width="154" height="44" rx="6" stroke-width="0.5"/><text class="th" x="217" y="372" text-anchor="middle">Cilium</text><text class="ts" x="217" y="388" text-anchor="middle">CNI + NetworkPolicy</text></g>
<g class="c-gray"><rect x="311" y="355" width="154" height="44" rx="6" stroke-width="0.5"/><text class="th" x="388" y="372" text-anchor="middle">Tetragon</text><text class="ts" x="388" y="388" text-anchor="middle">eBPF EDR</text></g>
<g class="c-gray"><rect x="482" y="355" width="154" height="44" rx="6" stroke-width="0.5"/><text class="th" x="559" y="372" text-anchor="middle">Registry</text><text class="ts" x="559" y="388" text-anchor="middle">:5000 (Tilt)</text></g>

<line x1="90" y1="402" x2="90" y2="425" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="102" y="418">backend provisions → labs node (nodeSelector)</text>

<g class="c-amber"><rect x="30" y="426" width="620" height="150" rx="12" stroke-width="0.5"/></g>
<text class="th" x="44" y="448">Labs node - k3d agent · label role=labs · runc</text>
<text class="ts" x="40" y="492">labs-baseline</text>
<g class="c-coral"><rect x="140" y="470" width="200" height="46" rx="6" stroke-width="0.5"/><text class="th" x="240" y="488" text-anchor="middle">lab-&lt;id&gt; · primary</text><text class="ts" x="240" y="505" text-anchor="middle">ttyd :7681 · rooted</text></g>
<g class="c-coral"><rect x="372" y="470" width="200" height="46" rx="6" stroke-width="0.5"/><text class="th" x="472" y="488" text-anchor="middle">lab-&lt;id&gt;-target</text><text class="ts" x="472" y="505" text-anchor="middle">httpd :8081</text></g>
<line x1="340" y1="493" x2="371" y2="493" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="140" y="540">2 NetworkPolicies: egress@primary → ingress@target · other sessions denied</text>

<g class="c-blue"><rect x="30" y="584" width="11" height="11" rx="3" stroke-width="0.5"/></g><text class="ts" x="46" y="593">edge/app</text>
<g class="c-purple"><rect x="130" y="584" width="11" height="11" rx="3" stroke-width="0.5"/></g><text class="ts" x="146" y="593">gitops/secrets</text>
<g class="c-teal"><rect x="270" y="584" width="11" height="11" rx="3" stroke-width="0.5"/></g><text class="ts" x="286" y="593">observability</text>
<g class="c-gray"><rect x="400" y="584" width="11" height="11" rx="3" stroke-width="0.5"/></g><text class="ts" x="416" y="593">platform</text>
<g class="c-coral"><rect x="500" y="584" width="11" height="11" rx="3" stroke-width="0.5"/></g><text class="ts" x="516" y="593">session pods</text>

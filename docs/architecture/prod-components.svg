<svg width="680" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Production full component diagram</title>
<desc>Every component of the production environment. External/managed: browser, Cloudflare DNS and CDN, PostHog analytics, GitHub repo with CI pushing to GHCR, and Hetzner (a Cloud CX33 control plane provisioned by Terraform plus a bare-metal AX41 joined via kubeadm). The control-plane node runs edge and app (Traefik, frontend, backend, postgres), GitOps and secrets (cert-manager, Vault, ArgoCD), observability (Loki, Grafana, Alloy), and platform (Cilium, Tetragon, the kubeadm control plane). The bare-metal AX41 labs node runs each session as a session-runner pod - a disposable nested k3s cluster wrapped in a Kata/Firecracker microVM - behind a default-deny NetworkPolicy.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #1a1d22; }
  .ts { font-size: 12px; fill: #4b525c; }
  .box { fill: #f5f5f6; stroke: #c7cbd1; stroke-width: 0.5; }
  .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
  .arr { stroke: #4b525c; stroke-width: 1.5; fill: none; }
</style>

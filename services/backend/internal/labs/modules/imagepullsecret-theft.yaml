# imagepullsecret-theft - a pull secret is a stored registry credential.
#
# Applied by the backend INTO a disposable nested k3s cluster, one per session
# (see internal/labs/nested.go's applyNestedManifests). The student's foothold -
# the `foothold` pod in namespace `lab` - has a service account that was granted
# read on Secrets in its namespace, an over-grant that looks harmless. Sitting in
# that namespace is an imagePullSecret: a `kubernetes.io/dockerconfigjson` Secret
# holding the credentials the kubelet uses to pull private images. Those are real
# registry credentials, and reading the Secret hands them over.
#
# The lesson - the supply-chain angle no other lab covers - is that an
# imagePullSecret is not "config", it is a standing username/password for a
# registry, stored in the cluster in a lightly-obscured form (base64 around a
# JSON blob whose `auth` field is itself base64 of user:password). Whoever can
# read Secrets in a namespace can harvest the registry account, and registry
# write access is how a supply-chain attacker plants a poisoned image every pod
# will later pull. What a defender should see: a workload identity reading a pull
# secret it never needs to read.
#
# Containment: the credential and registry are fictional (registry.internal); the
# flag is the password half of the stored auth. Bait, per _template/README.md.
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: station
  namespace: lab
---
# The objective, hiding in plain sight as routine plumbing: the registry pull
# secret. Its `.dockerconfigjson` is base64 (as all Secret data is); decode it and
# the JSON's `auth` field is base64 of `deploy-bot:<password>`. The password is
# the flag. A real pull secret looks exactly like this.
#
# The `auth` below is base64 of "deploy-bot:k8labs{registry_pull_secret_is_a_stored_credential}"
# - i.e. the flag is the password half. (Kept here in the clear so the flag<->manifest
#  guard, TestModuleFlagMatchesManifest, can see it; the student never reads this file.)
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: lab
  labels:
    # The kind of innocuous labelling that makes a pull secret read as
    # infrastructure rather than a credential worth stealing.
    app.kubernetes.io/managed-by: ci
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"registry.internal:5000":{"username":"deploy-bot","auth":"ZGVwbG95LWJvdDprOGxhYnN7cmVnaXN0cnlfcHVsbF9zZWNyZXRfaXNfYV9zdG9yZWRfY3JlZGVudGlhbH0="}}}
---
# PLANTED FLAW: the foothold's service account can read Secrets in its namespace.
# This is a common over-grant (a role that needed one ConfigMap given secrets
# too, or a wildcard), and it is all it takes - the pull secret is right there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: lab
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: station-reads-secrets
  namespace: lab
subjects:
  - kind: ServiceAccount
    name: station
    namespace: lab
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
---
# The foothold: where the student's terminal attaches. Its `station` token is
# mounted, and kubectl uses it automatically.
apiVersion: v1
kind: Pod
metadata:
  name: foothold
  namespace: lab
  labels:
    app: foothold
spec:
  hostname: imagepullsecret-theft
  serviceAccountName: station
  automountServiceAccountToken: true
  restartPolicy: Never
  containers:
    - name: shell
      image: k8labs-foothold:1.31
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"

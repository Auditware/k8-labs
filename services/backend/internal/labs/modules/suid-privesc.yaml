# suid-privesc - a SUID privilege-escalation lab as a manifest bundle.
#
# The lab is one pod in the disposable nested cluster. A root initContainer
# plants a SUID-root `backup-tool` (CWE-78 command injection) and a root-only
# flag into a shared volume; the student's shell runs as an unprivileged user
# and must exploit the injection to read the flag. Winning gets root in a
# container inside a throwaway cluster inside a microVM - the same containment
# ns-escape relies on.
#
# The binary is a compiled artifact, so it travels here as base64 in a
# ConfigMap (musl-static, ~23-35 KB per arch, both under the 1 MB ConfigMap
# limit even combined). No new airgap image, no CI/Tiltfile change - the lab is
# still just YAML the backend applies, which is the whole point of the nested
# shape. See services/labs/_template/README.md.
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab
---
# An explicit service account for the workstation pod. Without this the pod
# falls back to the namespace's `default` SA, which k3s's SA controller creates
# asynchronously after the namespace - and the backend's fast sequential apply
# beats it, so the Pod is rejected with "serviceaccount default not found".
# Declaring one the bundle creates removes the race. The token is never mounted
# (automountServiceAccountToken: false below); this SA exists only to satisfy
# admission.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: station
  namespace: lab
---
# The vulnerable binary, one key per architecture. The initContainer picks the
# right one at runtime, so the same bundle works on local arm64 (k3d) and prod
# amd64 (the AX41) without a rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-tool-bin
  namespace: lab
binaryData:
  backup-tool.amd64: 
  backup-tool.arm64: 
---
apiVersion: v1
kind: Pod
metadata:
  name: workstation
  namespace: lab
  labels:
    app: workstation
spec:
  # Sets the shell's \h (prompt reads user@suid-privesc -> root@suid-privesc on
  # escalation). Cosmetic, distinct from the pod name so nothing else moves.
  hostname: suid-privesc
  # No service account token: this lab is about a local SUID escalation, not
  # anything the cluster API grants. Nothing here should be reachable by
  # enumerating RBAC - the path up is the binary, full stop.
  serviceAccountName: station
  automountServiceAccountToken: false
  restartPolicy: Never
  volumes:
    - name: bin
      configMap:
        name: backup-tool-bin
    # The shared workspace. emptyDir is not mounted nosuid by kubelet, so the
    # SUID bit the initContainer sets is honoured by the main container - which
    # is the entire mechanic of the lab.
    - name: work
      emptyDir: {}
  initContainers:
    # Runs as root (uid 0) precisely so it can create a root-owned SUID binary
    # and a root-only flag that the unprivileged main container then cannot read
    # without escalating. This is the only root in the lab that is meant to be
    # there.
    - name: plant
      image: k8labs-foothold:1.31
      imagePullPolicy: Never
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: true
      command: ["sh", "-c"]
      args:
        - |
          set -e
          case "$(uname -m)" in
            x86_64)  SRC=/bin/backup-tool.amd64 ;;
            aarch64) SRC=/bin/backup-tool.arm64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          # Staged into the shared volume; the shell surfaces the binary at
          # /usr/local/bin (where a real backup utility lives) and the flag in
          # /app, both via subPath - see the shell container's mounts.
          install -m 0755 -o root -g root "$SRC" /stage/backup-tool
          # The SUID bit: owner root, setuid set. This is what makes the binary
          # run as root for the unprivileged student.
          chmod u+s /stage/backup-tool
          # The flag, readable only by root - the thing the student cannot get
          # without winning.
          printf 'k8labs{suid_command_injection_to_root_via_backup_tool}\n' > /stage/flag.txt
          chown root:root /stage/flag.txt
          chmod 0600 /stage/flag.txt
      volumeMounts:
        - { name: bin, mountPath: /bin/backup-tool.amd64, subPath: backup-tool.amd64 }
        - { name: bin, mountPath: /bin/backup-tool.arm64, subPath: backup-tool.arm64 }
        - { name: work, mountPath: /stage }
  containers:
    # The student's shell. Runs as an unprivileged user (10001), so the SUID
    # binary is the only way up and the flag starts out unreadable. The exec
    # terminal (internal/labs/terminal.go) opens /bin/sh here, as this user.
    - name: shell
      image: k8labs-foothold:1.31
      imagePullPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: true
      workingDir: /app
      command: ["sleep", "infinity"]
      env:
        - { name: PATH, value: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
      volumeMounts:
        # The SUID backup-tool at a realistic system path. It's delivered
        # through the shared emptyDir (not nosuid, so the SUID bit is honoured)
        # and surfaced here by subPath, so /app itself stays clean.
        - { name: work, mountPath: /usr/local/bin/backup-tool, subPath: backup-tool }
        # The root-only flag, sitting in the app dir the student lands in.
        - { name: work, mountPath: /app/flag.txt, subPath: flag.txt }
      resources:
        requests: { cpu: "50m", memory: "64Mi" }
        limits:   { cpu: "250m", memory: "256Mi" }

# Only rendered when Vault isn't in the picture (local/k3d - see values.yaml).
# Real environments get DATABASE_USER/DATABASE_PASSWORD/JWT_SIGNING_KEY from
# Vault Agent Injector instead (see deployment.yaml), never from a Secret
# object this chart owns.
{{- if not .Values.vault.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}-local
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_USER: {{ .Values.localSecret.databaseUser | quote }}
  DATABASE_PASSWORD: {{ .Values.localSecret.databasePassword | quote }}
  JWT_SIGNING_KEY: {{ .Values.localSecret.jwtSigningKey | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.localSecret.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.localSecret.googleClientSecret | quote }}
  GITHUB_CLIENT_ID: {{ .Values.localSecret.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.localSecret.githubClientSecret | quote }}
  ADMIN_EMAILS: {{ .Values.localSecret.adminEmails | quote }}
  ENTRANCE_TOKEN: {{ .Values.localSecret.entranceToken | quote }}
{{- end }}

# Least-privilege. Gets a Role/RoleBinding (not
# shown here - lives under apps/labs/ since it's scoped to that namespace)
# granting create/delete on Pods+Services in the labs namespace only.
# No cluster-admin, ever.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}

# Dev-only credentials until section 6 (Vault) lands for this chart -
# see values.yaml. The official postgres image's bootstrap script reads
# POSTGRES_USER/PASSWORD/DB by its own convention.
#
# existingSecret (prod): when set, this chart renders NO Secret - the deployment
# references a Secret created out-of-band (kubectl create secret) so the real
# password never lands in git/values. Local/Tilt leaves it empty and uses the
# rendered dev credentials below.
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.credentials.databaseUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.databasePassword | quote }}
  POSTGRES_DB: {{ .Values.credentials.databaseName | quote }}
{{- end }}
